<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><title>Maintenance Ticket Triage</title><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{font-family:system-ui;background:#0d1117;color:#e6edf3;max-width:720px;margin:auto;padding:2rem}h1{color:#58a6ff}a{color:#58a6ff}textarea{width:100%}button{background:#1f6feb;color:#fff;border:0;padding:.6rem 1rem;border-radius:8px;margin-top:.5rem}#out{margin-top:1rem;background:#161b22;padding:1rem;border-radius:8px;white-space:pre-wrap}</style></head><body><h1>🎫 Maintenance Ticket Triage</h1><p>Paste a ticket description and get instant classification.</p><textarea id="d" rows="4" placeholder="e.g. Server DOWN, storage array degraded, customers impacted..."></textarea><br><button onclick="go()">Triage</button><div id="out"></div><script>function go(){const d=document.getElementById('d').value.toLowerCase();let cat='General IT',pri='P3';if(/server|storage|disk|raid/.test(d))cat='Infrastructure';if(/network|switch|router|wan/.test(d))cat='Network';if(/down|outage|degraded|critical/.test(d)){pri='P1'}else if(/slow|error|fail/.test(d)){pri='P2'}document.getElementById('out').textContent=`Category: ${cat}\nPriority: ${pri}\nRoute: ${cat==='Network'?'Network Ops':cat==='Infrastructure'?'Data Center Ops':'Service Desk'} queue\nSLA clock: ${pri==='P1'?'1h response / 4h restore':pri==='P2'?'4h / 8h':'8h / 24h'}\n\nFull AI triage deployment: commercial@ziontechgroup.com`}</script><p><a href="https://ziontechgroup.com/apps/">← Zion App Network</a> · <a href="https://github.com/Zion-support/maintenance-ticket-triage">GitHub</a> · <a href="https://ziontechgroup.com/sla-forecast-guardian/">SLA Guardian</a></p></body></html>
